[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /api/* -> Netlify Function (server/app.ts's Express app, wrapped by netlify/functions/api.ts)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# React Router SPA fallback — must come after the /api redirect above
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
